<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AccountaTrade — V1</title>
<style>
:root{--bg:#0b0d10;--panel:#12161b;--panel2:#171c22;--text:#f4f6f8;--muted:#8d98a5;--gold:#d6ad55;--line:#252c34;--green:#52c98a;--red:#ef6b73}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
header{border-bottom:1px solid var(--line);padding:18px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(11,13,16,.95);z-index:5}
.brand{font-weight:800;letter-spacing:.3px}.brand span{color:var(--gold)} .tag{font-size:12px;color:var(--muted)}
main{max-width:1180px;margin:auto;padding:28px 18px 60px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}
h1{margin:0 0 6px;font-size:32px}.sub{color:var(--muted);margin:0}
button{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--gold);color:#111}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}.value{font-size:25px;font-weight:800;margin-top:8px}.green{color:var(--green)}.red{color:var(--red)}
.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}input,select,textarea{width:100%;background:#0d1115;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}textarea{min-height:80px;resize:vertical}.wide{grid-column:span 2}.full{grid-column:1/-1}.form-actions{display:flex;gap:8px;justify-content:flex-end;grid-column:1/-1}
.table-wrap{overflow:auto}.trades{width:100%;border-collapse:collapse}.trades th,.trades td{text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}.trades th{font-size:11px;color:var(--muted);text-transform:uppercase}
.empty{text-align:center;color:var(--muted);padding:35px}.rulebar{height:8px;background:#20262e;border-radius:99px;overflow:hidden;margin-top:10px}.rulefill{height:100%;background:var(--gold);width:0}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(850px,100%);max-height:90vh;overflow:auto;padding:20px}.close{float:right;background:transparent;color:var(--muted);font-size:22px;padding:0}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}form{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 2}.hero{align-items:start;flex-direction:column}}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}form{grid-template-columns:1fr}.wide{grid-column:span 1}.value{font-size:20px}}
</style>
</head>
<body>
<header><div class="brand">Accounta<span>Trade</span></div><div class="tag">Every trade. Every lesson. Every step forward.</div></header>
<main>
<section class="hero"><div><h1>Trading Dashboard</h1><p class="sub">Your process first. Your P&L second.</p></div><button onclick="openModal()">+ Add Trade</button></section>

<section class="stats">
<div class="card"><div class="label">Net P&L</div><div id="pnl" class="value">$0.00</div></div>
<div class="card"><div class="label">Win Rate</div><div id="winrate" class="value">0%</div></div>
<div class="card"><div class="label">Total Trades</div><div id="count" class="value">0</div></div>
<div class="card"><div class="label">Rule Adherence</div><div id="adherence" class="value">0%</div><div class="rulebar"><div id="rulefill" class="rulefill"></div></div></div>
</section>

<section class="section"><div class="panel"><h2>Performance</h2><div class="stats">
<div><div class="label">Average R:R</div><div id="avgRR" class="value">—</div></div>
<div><div class="label">Wins</div><div id="wins" class="value green">0</div></div>
<div><div class="label">Losses</div><div id="losses" class="value red">0</div></div>
<div><div class="label">Profit Factor</div><div id="pf" class="value">—</div></div>
</div></div></section>

<section class="section"><div class="panel"><h2>Recent Trades</h2><div class="table-wrap"><table class="trades"><thead><tr><th>Date</th><th>Symbol</th><th>Side</th><th>Setup</th><th>Result</th><th>R:R</th><th>Rules</th></tr></thead><tbody id="tradeBody"></tbody></table></div></div></section>
</main>

<div id="modal" class="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><h2>Add Trade</h2>
<form id="tradeForm">
<div><label>Date</label><input id="date" type="datetime-local" required></div>
<div><label>Symbol</label><input id="symbol" placeholder="XAUUSD" required></div>
<div><label>Side</label><select id="side"><option>BUY</option><option>SELL</option></select></div>
<div><label>Session</label><select id="session"><option>London</option><option>New York</option><option>Asian</option><option>Other</option></select></div>
<div><label>Entry</label><input id="entry" type="number" step="any" required></div>
<div><label>Stop Loss</label><input id="sl" type="number" step="any" required></div>
<div><label>Take Profit</label><input id="tp" type="number" step="any" required></div>
<div><label>Exit</label><input id="exit" type="number" step="any" required></div>
<div><label>P&L ($)</label><input id="pnlInput" type="number" step="any" required></div>
<div><label>Setup</label><input id="setup" placeholder="MSS + FVG"></div>
<div><label>Market Bias</label><select id="bias"><option>Bullish</option><option>Bearish</option><option>Neutral</option></select></div>
<div><label>Emotion</label><select id="emotion"><option>Calm</option><option>Confident</option><option>FOMO</option><option>Fear</option><option>Revenge</option><option>Greed</option></select></div>
<div><label>Rules followed</label><select id="rules"><option value="10">10/10</option><option value="9">9/10</option><option value="8">8/10</option><option value="7">7/10</option><option value="6">6/10</option><option value="5">5/10</option><option value="4">4/10</option><option value="3">3/10</option><option value="2">2/10</option><option value="1">1/10</option><option value="0">0/10</option></select></div>
<div class="wide"><label>Why did you enter?</label><textarea id="reason" placeholder="What did you see?"></textarea></div>
<div class="wide"><label>Lesson / notes</label><textarea id="lesson" placeholder="What did this trade teach you?"></textarea></div>
<div class="form-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button type="submit">Save Trade</button></div>
</form></div></div>

<script>
const KEY='accountatrade_v1_trades';
const $=id=>document.getElementById(id);
let trades=JSON.parse(localStorage.getItem(KEY)||'[]');
function money(n){return (n>=0?'+':'')+'$'+Math.abs(n).toFixed(2)}
function calcR(t){
 const risk=Math.abs(Number(t.entry)-Number(t.sl));
 const reward=Math.abs(Number(t.tp)-Number(t.entry));
 return risk?reward/risk:0;
}
function render(){
 const n=trades.length,w=trades.filter(t=>Number(t.pnl)>0),l=trades.filter(t=>Number(t.pnl)<0);
 const pnl=trades.reduce((a,t)=>a+Number(t.pnl),0);
 const adherence=n?trades.reduce((a,t)=>a+Number(t.rules),0)/(n*10)*100:0;
 const avgRR=n?trades.reduce((a,t)=>a+Number(t.rr),0)/n:0;
 const grossWin=w.reduce((a,t)=>a+Number(t.pnl),0), grossLoss=Math.abs(l.reduce((a,t)=>a+Number(t.pnl),0));
 $('pnl').textContent=money(pnl); $('pnl').className='value '+(pnl>0?'green':pnl<0?'red':'');
 $('winrate').textContent=(n?(w.length/n*100):0).toFixed(1)+'%';
 $('count').textContent=n; $('adherence').textContent=adherence.toFixed(1)+'%'; $('rulefill').style.width=adherence+'%';
 $('avgRR').textContent=n?avgRR.toFixed(2)+'R':'—'; $('wins').textContent=w.length; $('losses').textContent=l.length; $('pf').textContent=grossLoss?(grossWin/grossLoss).toFixed(2):grossWin?'∞':'—';
 const body=$('tradeBody'); body.innerHTML='';
 if(!n){body.innerHTML='<tr><td colspan="7" class="empty">No trades yet. Your first trade starts the journal.</td></tr>';return}
 [...trades].reverse().slice(0,20).forEach(t=>{
  const d=new Date(t.date).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  const cls=Number(t.pnl)>0?'green':Number(t.pnl)<0?'red':'';
  body.innerHTML+=`<tr><td>${d}</td><td><b>${t.symbol}</b></td><td>${t.side}</td><td>${t.setup||'—'}</td><td class="${cls}"><b>${money(Number(t.pnl))}</b></td><td>${Number(t.rr).toFixed(2)}R</td><td>${t.rules}/10</td></tr>`;
 });
}
function openModal(){$('modal').classList.add('open'); if(!$('date').value){let d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('date').value=d.toISOString().slice(0,16)}}
function closeModal(){$('modal').classList.remove('open')}
$('tradeForm').addEventListener('submit',e=>{
 e.preventDefault();
 const t={date:$('date').value,symbol:$('symbol').value.toUpperCase(),side:$('side').value,session:$('session').value,entry:$('entry').value,sl:$('sl').value,tp:$('tp').value,exit:$('exit').value,pnl:$('pnlInput').value,setup:$('setup').value,bias:$('bias').value,emotion:$('emotion').value,rules:$('rules').value,reason:$('reason').value,lesson:$('lesson').value};
 t.rr=calcR(t); trades.push(t); localStorage.setItem(KEY,JSON.stringify(trades)); render(); e.target.reset(); closeModal();
});
render();
</script>
</body>
</html>
